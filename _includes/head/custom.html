<!-- start custom head snippets -->

<meta property="og:title" content="Mirza Akhi: Publications, Articles, and Blog">
<meta property="og:description" content="Dive into the world of Mirza Akhi, where you can explore a curated collection of publications, insightful articles, and engaging blog posts. Join the journey of thoughts, research, and creativity.">
<meta property="og:image" content="https://mirzaakhi.github.io/images/OG-Facebook.jpg">
<meta property="og:url" content="https://mirzaakhi.github.io">
<meta property="og:type" content="website">

<!-- Favicons -->
<link rel="shortcut icon" href="{{ base_path }}/images/favicon.ico">
<link rel="icon" type="image/x-icon" href="{{ base_path }}/images/favicon.ico">
<link rel="icon" type="image/png" sizes="96x96" href="{{ base_path }}/images/favicon-96x96.png">
<link rel="apple-touch-icon" href="{{ base_path }}/images/apple-touch-icon.png">
<link rel="manifest" href="{{ base_path }}/images/site.webmanifest">
<link rel="mask-icon" href="{{ base_path }}/images/safari-pinned-tab.svg" color="#000000">

<meta name="theme-color" content="#ffffff">

<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    TeX: {
      equationNumbers: { autoNumber: "all" }
    }
  });
</script>

<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML" async></script>

<!-- end custom head snippets -->
